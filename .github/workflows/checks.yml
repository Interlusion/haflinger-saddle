name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request's branch cancels the run before it; on main each commit keeps
# its run, so that every merge gets a result and its commits a secret scan.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version from pyproject.toml's required-version.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # Fails too when uv.lock doesn't match pyproject.toml.
      - run: uv sync --locked
      - run: uv run mdformat --check .
      - name: Markdown links
        run: scripts/check-links.sh
      - name: Workflows
        run: scripts/check-workflows.sh

  # A job of its own: a new advisory, or the advisory database out of reach, fails it alone,
  # not the checks above.
  audit:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version from pyproject.toml's required-version.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Vulnerability audit of the lock
        run: uv audit --locked

  secrets:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the pushed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-secrets.sh "$BASE"
